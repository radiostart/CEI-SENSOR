[env:esp32-c3-mini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf

; ESP-IDF 설정
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
board_build.flash_size = 4MB

; 커스텀 파티션 테이블 (ota_0 1MB + ota_1 1MB + SPIFFS 1920KB)
board_build.partitions = partitions.csv

; 시리얼 모니터 설정
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; 업로드 설정 (esptool — USB-CDC 시리얼)
; esptool 안 되는 보드는: bash flash.sh (OpenOCD)
upload_protocol = esptool
upload_speed = 460800

; 디버그 설정 (ESP32-C3 내장 USB JTAG)
debug_tool = esp-builtin
debug_speed = 40000

; Git 태그에서 펌웨어 버전 자동 추출 (v1.2.3 → APP_FW_MAJOR/MINOR/PATCH)
extra_scripts = pre:scripts/version_from_git.py

; sdkconfig 기본값 (프로젝트 루트의 sdkconfig.defaults 자동 적용)
